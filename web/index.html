<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Una aventura cooperativa para dos personas. Sin cuentas ni internet.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="El Faro de los Dos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>El Faro de los Dos</title>
  <link rel="manifest" href="manifest.json">
<style>html,body{background:#081b25;margin:0;height:100%;color:#f4ebd7}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:17px;font:17px Georgia,serif;letter-spacing:1px}#loading .light{height:5px;width:90px;background:#183f44;border-radius:5px;overflow:hidden}#loading .light:after{content:'';display:block;height:100%;width:40%;background:#d6b574;animation:glow 1.5s ease-in-out infinite alternate}@keyframes glow{to{transform:translateX(140%)}}</style></head>
<body><div id="loading" aria-label="Cargando el juego"><span>El Faro de los Dos</span><span class="light"></span><small style="font:10px sans-serif;opacity:.6">Preparando vuestra aventura…</small></div><script>window.addEventListener("flutter-first-frame",function(){var x=document.getElementById("loading");if(x)x.remove();});</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
